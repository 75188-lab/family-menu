<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#eef5ee"><meta name="description" content="离线使用的家庭午餐选菜、采购与冰柜管理工具"><link rel="manifest" href="manifest.webmanifest"><title>家常好好吃 · 家庭菜单</title><style>
:root{font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif;color:#23372d;background:#f5f7f2;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45}header{background:linear-gradient(135deg,#dcedd9,#f8f2db);padding:26px 18px 20px;border-radius:0 0 26px 26px}header h1{margin:4px 0;font-size:27px}header p{margin:0;color:#617266;font-size:13px}.wrap{max-width:820px;margin:auto;padding-bottom:94px}main{padding:18px 14px}.panel{border:1px solid #e3e8de;border-radius:20px;background:white;padding:16px;margin-bottom:15px;box-shadow:0 2px 9px #203b2209}.panel h2{font-size:18px;margin:0 0 12px}.muted{color:#738074;font-size:13px}.row{display:flex;gap:9px;align-items:center}.spread{justify-content:space-between}.grow{flex:1}.pill{background:#edf3e8;border-radius:100px;color:#52705b;font-size:12px;padding:5px 10px}.btn{border:0;background:#2f6950;color:white;padding:11px 15px;border-radius:12px;font-weight:650}.btn.secondary{background:#e8f0e7;color:#27523e}.btn.ghost{background:#f3f5f1;color:#4b6654}.btn.warn{background:#fff0ed;color:#ad4434}.btn.small{padding:7px 10px;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dish{padding:14px;border:1px solid #e2e9df;border-radius:15px;background:#fbfdf9;min-width:0}.dish strong{display:block;font-size:17px;margin:8px 0;overflow-wrap:anywhere}.dish .hint{font-size:12px;color:#7a8b7c}.tiny{font-size:12px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;font-size:13px;color:#607365}.field input,.field select,.field textarea{background:white;border:1px solid #d5dfd4;color:#22382a;border-radius:10px;padding:11px;width:100%;outline-color:#50986c}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid #d6e2d6;background:white;border-radius:99px;padding:8px 11px;color:#47614f;font-size:13px}.chip.active{background:#356e53;color:white;border-color:#356e53}.entry{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #edf1ed;padding:12px 0;gap:8px}.entry:first-child{border-top:0}.entry .name{font-weight:650}.entry .sub{font-size:12px;color:#7d8a7c;margin-top:4px}.actions{display:flex;gap:5px;flex-shrink:0}.iconbtn{border:0;background:#eff4ee;padding:7px 9px;border-radius:9px;color:#46604d}.bottom{position:fixed;bottom:0;left:0;right:0;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e7ece6;display:flex;justify-content:center;z-index:20}.nav{width:min(820px,100%);display:flex;justify-content:space-around;gap:3px}.nav button{background:none;border:0;color:#819085;font-size:11px;padding:8px 2px;width:20%;border-radius:10px}.nav button span{display:block;font-size:20px;margin-bottom:2px}.nav button.on{background:#e5f0e7;color:#23563d;font-weight:700}dialog{border:0;border-radius:20px;padding:18px;width:min(94vw,460px);max-height:88vh;overflow:auto;box-shadow:0 18px 80px #0004}dialog::backdrop{background:#1b2920a1}dialog h2{margin:0 0 16px}.notice{padding:11px 13px;background:#eff7ec;border-radius:12px;font-size:13px;color:#4b6653;line-height:1.6}.empty{padding:20px 8px;text-align:center;color:#879488}.check{width:19px;height:19px;accent-color:#396d51}.tag{font-size:11px;background:#f0f2e7;color:#6d714f;padding:4px 7px;border-radius:7px}#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#233a2c;color:white;padding:10px 16px;border-radius:12px;display:none;z-index:100;max-width:88vw;text-align:center;font-size:13px}@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}main{padding:22px}}
</style></head><body><div class="wrap"><header><div class="row spread"><span class="pill">我的家庭厨房</span><span class="tiny" id="count"></span></div><h1>家常好好吃 🥬</h1><p>选两道喜欢的菜，轻松准备三个人的午餐。</p></header><main id="app"></main></div><nav class="bottom"><div class="nav" id="nav"></div></nav><div id="toast" role="status"></div><dialog id="editor"><form id="editform"><h2 id="editTitle">添加菜品</h2><input id="editid" type="hidden"><label class="field">菜名<input id="editname" required maxlength="45" placeholder="例如：番茄炖豆腐"></label><label class="field">分类<select id="editcat"></select></label><label class="field">预计时间（分钟）<input id="edittime" type="number" min="1" max="600" value="20" required></label><label class="field">备餐方式<select id="editfreeze"><option value="现做">现做</option><option value="生冻">生鲜分装冷冻</option><option value="熟冻">熟制后分装冷冻</option><option value="熟冻丸子">可提前做丸子冷冻</option></select></label><label class="field">备注（选填）<textarea id="editnote" rows="2" maxlength="180" placeholder="例如：爸妈爱吃、少放盐"></textarea></label><div class="row spread"><button type="button" class="btn ghost" onclick="document.getElementById('editor').close()">取消</button><button class="btn" type="submit">保存菜品</button></div></form></dialog><script>
'use strict';
const DBKEY='family-menu-v1';
const raw=`香菇蒸鸡腿肉|肉禽主菜|30|熟冻;彩椒蘑菇炒鸡丁|肉禽主菜|20|生冻;芹菜炒牛肉|肉禽主菜|20|生冻;洋葱木耳炒肉片|肉禽主菜|20|生冻;莴笋炒肉片|肉禽主菜|15|生冻;木须肉|肉禽主菜|25|生冻;青椒肉丝|肉禽主菜|20|生冻;少油宫保鸡丁|肉禽主菜|25|生冻;香菇肉末蒸豆腐|肉禽主菜|25|生冻;冬瓜瘦肉丸子汤|肉禽主菜|25|熟冻丸子;清蒸鲈鱼|鱼虾蛋类|25|生冻;番茄鱼片|鱼虾蛋类|20|生冻;清蒸鳕鱼|鱼虾蛋类|20|生冻;姜葱蒸带鱼|鱼虾蛋类|25|生冻;西葫芦虾仁炒蛋|鱼虾蛋类|20|生冻;虾仁蒸蛋|鱼虾蛋类|20|生冻;芦笋炒虾仁|鱼虾蛋类|15|生冻;番茄炒蛋|鱼虾蛋类|15|现做;青椒木耳炒鸡蛋|鱼虾蛋类|15|现做;丝瓜炒鸡蛋|鱼虾蛋类|15|现做;小白菜炖豆腐|豆制品|20|现做;芹菜香干炒木耳|豆制品|15|现做;家常豆腐（少油版）|豆制品|25|现做;肉末豆腐|豆制品|20|生冻;白菜豆腐煲|豆制品|25|现做;麻婆豆腐（低盐版）|豆制品|20|现做;番茄金针菇豆腐煲|豆制品|20|现做;香菇烧豆腐|豆制品|20|现做;韭菜炒豆干|豆制品|15|现做;西芹百合炒豆干|豆制品|20|现做;蒜蓉西兰花炒口蘑|蔬菜配菜|15|现做;醋溜白菜|蔬菜配菜|10|现做;黄瓜拌木耳|蔬菜配菜|10|现做;番茄烧茄子（少油版）|蔬菜配菜|20|现做;香菇炒四季豆|蔬菜配菜|20|现做;蒜蓉油麦菜|蔬菜配菜|10|现做;手撕包菜|蔬菜配菜|15|现做;清炒芦笋口蘑|蔬菜配菜|15|现做;蒜蓉菠菜|蔬菜配菜|10|现做;清炒西葫芦|蔬菜配菜|10|现做;萝卜炖牛肉|冷冻炖菜|90|熟冻;番茄炖牛肉|冷冻炖菜|90|熟冻;香菇炖鸡|冷冻炖菜|60|熟冻;番茄牛肉丸|冷冻炖菜|55|熟冻;鸡肉香菇丸子|冷冻炖菜|50|熟冻;清炖鸡腿菌菇|冷冻炖菜|55|熟冻;番茄洋葱炖牛腱|冷冻炖菜|100|熟冻;白菜瘦肉丸子|冷冻炖菜|45|熟冻丸子;白萝卜炖瘦排骨|冷冻炖菜|75|熟冻;玉米胡萝卜炖鸡|冷冻炖菜|60|熟冻;酸汤瘦牛肉|偶尔换味|25|生冻;日式照烧鸡腿（减糖减盐）|偶尔换味|25|生冻;泰式柠檬蒸鱼|偶尔换味|25|生冻;韩式牛肉拌饭|偶尔换味|30|生冻;少油咖喱鸡肉|偶尔换味|35|熟冻;蒜香煎鸡腿排|偶尔换味|25|生冻;番茄鸡肉意式炖菜|偶尔换味|40|熟冻;柠檬香草烤鱼|偶尔换味|30|生冻;黑椒蘑菇牛肉|偶尔换味|20|生冻;空气炸锅蒜香虾|偶尔换味|20|生冻`;
const seed=raw.split(';').map((s,i)=>{const [name,cat,time,freeze]=s.split('|');return {id:'seed'+i,name,cat,time:+time,freeze,note:'',fav:false}});
const cats=['肉禽主菜','鱼虾蛋类','豆制品','蔬菜配菜','冷冻炖菜','偶尔换味'];
function initial(){return {version:1,dishes:seed,shopping:[],stock:[],history:[],pair:[seed[0].id,seed[30].id],locks:[false,false]}}
function load(){try{const d=JSON.parse(localStorage.getItem(DBKEY));if(d&&Array.isArray(d.dishes)&&Array.isArray(d.shopping))return {...initial(),...d}}catch(e){}return initial()}
let data=load(),view='home',category='全部',quick='全部',query='';
function persist(){try{localStorage.setItem(DBKEY,JSON.stringify(data))}catch(e){toast('保存失败：浏览器存储不可用，请立即导出备份')}}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>el.style.display='none',2500)}
const get=id=>data.dishes.find(d=>d.id===id);
const btn=(text,act,cl='secondary')=>`<button class="btn ${cl} small" data-act="${act}">${text}</button>`;
function pick(exclude,mode){let arr=data.dishes.filter(d=>d.id!==exclude && (mode==='veg'?d.cat==='蔬菜配菜':d.cat!=='蔬菜配菜'));if(!arr.length)arr=data.dishes.filter(d=>d.id!==exclude);if(!arr.length)return null;return arr[Math.floor(Math.random()*arr.length)].id}
function draw(){document.getElementById('count').textContent=data.dishes.length+' 道菜';const navs=[['home','🏠','今日'],['menu','📚','菜库'],['shopping','🛒','采购'],['stock','❄️','冰柜'],['history','🗓️','记录']];document.getElementById('nav').innerHTML=navs.map(([v,ic,n])=>`<button data-nav="${v}" class="${view===v?'on':''}"><span>${ic}</span>${n}</button>`).join('');document.getElementById('app').innerHTML=({home:homePage,menu:menuPage,shopping:shoppingPage,stock:stockPage,history:historyPage}[view])()}
function homePage(){const slots=data.pair.map((id,i)=>{const d=get(id);return `<div class="dish"><div class="row spread"><span class="pill">${i?'蔬菜搭配':'蛋白质主菜'}</span><button class="iconbtn" data-act="lock:${i}" aria-label="锁定">${data.locks[i]?'🔒':'🔓'}</button></div><strong>${escapeHTML(d?.name||'请选择一道菜')}</strong><div class="hint">${d?`${d.time}分钟 · ${escapeHTML(d.freeze)}`:''}</div><div class="toolbar">${btn('换这道','swap:'+i)}${d?btn('♡ 收藏','fav:'+d.id,'ghost'):''}</div></div>`}).join('');return `<section class="panel"><div class="row spread"><h2>今天吃什么？</h2><span class="pill">默认三人份</span></div><div class="grid">${slots}</div><div class="toolbar">${btn('🎲 换一组','shuffle','')}${btn('✅ 记入今天午餐','eat')}${btn('🛒 去列采购清单','goshop','ghost')}</div><div class="notice">🔒 可以锁住喜欢的一道，只换另一道。这里不放做菜教程；想学做法，长按或复制菜名去视频平台搜索即可。</div></section><section class="panel"><h2>备餐小提醒</h2><p class="muted">午餐尽量有足量蛋白质和蔬菜，主食按家人需要另配；土豆和粉条也算主食来源的一部分。高血压要注意盐、酱油和各类调味酱的总量。</p><div class="row">${btn('➕ 添加我家的菜','add')}${btn('数据备份与恢复','backup','ghost')}</div></section>`}
function menuPage(){let arr=data.dishes.filter(d=>(category==='全部'||category==='已收藏'&&d.fav||d.cat===category)&&(!query||d.name.toLowerCase().includes(query.toLowerCase()))&&(quick==='全部'||quick==='20分钟内'&&d.time<=20||quick==='可冷冻'&&d.freeze!=='现做'));return `<section class="panel"><div class="row spread"><h2>我的菜库</h2>${btn('＋ 添加新菜','add','')}</div><label class="field"><input id="search" placeholder="搜索菜名…" value="${escapeHTML(query)}"></label><div class="toolbar">${['全部','已收藏',...cats].map(c=>`<button class="chip ${category===c?'active':''}" data-cat="${escapeHTML(c)}">${escapeHTML(c)}</button>`).join('')}</div><div class="toolbar">${['全部','20分钟内','可冷冻'].map(c=>`<button class="chip ${quick===c?'active':''}" data-quick="${escapeHTML(c)}">${c}</button>`).join('')}</div><p class="muted">找到 ${arr.length} 道菜 · 点 ☆ 收藏 · 任何菜都可以修改</p><div>${arr.map(d=>`<div class="entry"><div class="grow"><div class="name">${escapeHTML(d.name)} ${d.fav?'⭐':''}</div><div class="sub">${escapeHTML(d.cat)} · ${d.time}分钟 · ${escapeHTML(d.freeze)}${d.note?' · '+escapeHTML(d.note):''}</div></div><div class="actions"><button class="iconbtn" data-act="fav:${d.id}" aria-label="收藏">${d.fav?'★':'☆'}</button><button class="iconbtn" data-act="edit:${d.id}" aria-label="编辑">✎</button><button class="iconbtn" data-act="delete:${d.id}" aria-label="删除">×</button></div></div>`).join('')||'<div class="empty">暂无符合条件的菜品</div>'}</div></section>`}
function shoppingPage(){return `<section class="panel"><h2>采购清单</h2><p class="muted">自由填写食材，不需要为每道菜录入精确配方。</p><form id="shopform" class="row"><input class="grow" name="item" required maxlength="80" placeholder="例如：鸡腿 600克" style="min-width:0;border:1px solid #d5dfd4;border-radius:10px;padding:11px"><button class="btn">添加</button></form><div style="margin-top:12px">${data.shopping.map(s=>`<div class="entry"><label class="row grow"><input class="check" type="checkbox" data-checkshop="${s.id}" ${s.done?'checked':''}><span style="${s.done?'text-decoration:line-through;color:#999':''}">${escapeHTML(s.name)}</span></label><button class="iconbtn" data-act="delshop:${s.id}">×</button></div>`).join('')||'<div class="empty">清单还是空的</div>'}</div><div class="toolbar">${btn('删除已勾选','clearshop','ghost')}</div></section>`}
function stockPage(){return `<section class="panel"><h2>冰柜库存</h2><p class="muted">记录已经冻好的菜或食材，别忘记制作日期与数量。</p><form id="stockform"><label class="field">名称<input name="name" maxlength="80" required placeholder="例如：番茄炖牛肉"></label><div class="grid"><label class="field">数量 / 单位<input name="qty" maxlength="40" required placeholder="例如：3盒"></label><label class="field">冷冻日期<input name="date" type="date" required value="${today()}"></label></div><button class="btn" type="submit">＋ 加入冰柜</button></form><div style="margin-top:14px">${data.stock.map(s=>`<div class="entry"><div class="grow"><div class="name">${escapeHTML(s.name)}</div><div class="sub">${escapeHTML(s.qty)} · ${escapeHTML(s.date)}</div></div><div class="actions"><button class="iconbtn" data-act="stockuse:${s.id}">已用完</button><button class="iconbtn" data-act="stockdel:${s.id}">×</button></div></div>`).join('')||'<div class="empty">冰柜里还没登记库存</div>'}</div></section>`}
function historyPage(){return `<section class="panel"><div class="row spread"><h2>午餐记录</h2>${btn('备份与恢复','backup','ghost')}</div><p class="muted">只记菜名与日期，不计算热量。</p>${data.history.map(h=>`<div class="entry"><div class="grow"><div class="name">${escapeHTML(h.dishes.join(' ＋ '))}</div><div class="sub">${escapeHTML(h.date)}</div></div><button class="iconbtn" data-act="delhistory:${h.id}">×</button></div>`).join('')||'<div class="empty">还没有记录过午餐</div>'}</section><section class="panel"><h2>数据管理</h2><div class="notice">数据默认只存放在当前手机的这个网页里。换手机、清浏览器数据或换浏览器之前，请先导出备份文件。</div><div class="toolbar">${btn('导出 JSON 备份','export','')}${btn('导入备份','import','ghost')}</div><input id="importfile" type="file" accept=".json,application/json" style="display:none"><p class="muted">版本 1 · 本地存储 · 不上传你的家庭记录</p></section>`}
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function edit(id){const d=get(id);document.getElementById('editTitle').textContent=d?'修改菜品':'添加菜品';document.getElementById('editid').value=d?.id||'';document.getElementById('editname').value=d?.name||'';document.getElementById('editcat').innerHTML=cats.map(c=>`<option value="${c}">${c}</option>`).join('');document.getElementById('editcat').value=d?.cat||cats[0];document.getElementById('edittime').value=d?.time||20;document.getElementById('editfreeze').value=d?.freeze||'现做';document.getElementById('editnote').value=d?.note||'';document.getElementById('editor').showModal()}
function saveEdit(e){e.preventDefault();const id=document.getElementById('editid').value;const old=get(id);const name=document.getElementById('editname').value.trim();if(!name)return;const entry={id:id||'custom'+Date.now()+Math.random().toString(36).slice(2,6),name,cat:document.getElementById('editcat').value,time:Number(document.getElementById('edittime').value),freeze:document.getElementById('editfreeze').value,note:document.getElementById('editnote').value.trim(),fav:old?.fav||false};if(old)Object.assign(old,entry);else data.dishes.unshift(entry);persist();document.getElementById('editor').close();view='menu';draw();toast('菜品已保存')}
function backup(){view='history';draw();toast('在记录页底部可以导出或导入备份')}
function exportJSON(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='家常好好吃-备份-'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('已生成备份文件')}
function importJSON(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!obj||!Array.isArray(obj.dishes)||!Array.isArray(obj.shopping)||!Array.isArray(obj.stock)||!Array.isArray(obj.history))throw Error('格式不匹配');if(!confirm('导入将覆盖当前菜库、收藏、采购和记录，确定继续吗？'))return;data={...initial(),...obj};persist();view='home';draw();toast('已恢复备份')}catch(e){alert('导入失败：'+e.message)}};reader.readAsText(file)}
function action(v){const [a,id]=v.split(':');if(a==='add')edit();if(a==='edit')edit(id);if(a==='fav'){const d=get(id);if(d){d.fav=!d.fav;persist();draw()}}if(a==='delete'){const d=get(id);if(d&&confirm('确定删除「'+d.name+'」吗？')){data.dishes=data.dishes.filter(x=>x.id!==id);data.pair=data.pair.map(x=>x===id?null:x);persist();draw()}}if(a==='lock'){data.locks[+id]=!data.locks[+id];persist();draw()}if(a==='swap'){if(!data.locks[+id]){data.pair[+id]=pick(data.pair[1-(+id)],+id?'veg':'main');persist();draw()}else toast('这道已锁定，请先解锁')}if(a==='shuffle'){data.pair=data.pair.map((d,i)=>data.locks[i]?d:pick(i===0?data.pair[1]:data.pair[0],i?'veg':'main'));persist();draw()}if(a==='eat'){const names=data.pair.map(get).filter(Boolean).map(x=>x.name);if(names.length){data.history.unshift({id:Date.now().toString(),date:today(),dishes:names});persist();toast('已记入午餐历史')}else toast('请先选择菜品')}if(a==='goshop'){view='shopping';draw()}if(a==='backup')backup();if(a==='clearshop'){data.shopping=data.shopping.filter(x=>!x.done);persist();draw()}if(a==='delshop'){data.shopping=data.shopping.filter(x=>x.id!==id);persist();draw()}if(a==='stockuse'||a==='stockdel'){data.stock=data.stock.filter(x=>x.id!==id);persist();draw()}if(a==='delhistory'){data.history=data.history.filter(x=>x.id!==id);persist();draw()}if(a==='export')exportJSON();if(a==='import')document.getElementById('importfile')?.click()}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){view=nav.dataset.nav;draw();return}const b=e.target.closest('[data-act]');if(b)action(b.dataset.act);const c=e.target.closest('[data-cat]');if(c){category=c.dataset.cat;draw()}const q=e.target.closest('[data-quick]');if(q){quick=q.dataset.quick;draw()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const at=e.target.selectionStart;draw();const inp=document.getElementById('search');inp.focus();inp.setSelectionRange(at,at)}});
document.addEventListener('change',e=>{const id=e.target.dataset.checkshop;if(id){const s=data.shopping.find(x=>x.id===id);if(s){s.done=e.target.checked;persist();draw()}}if(e.target.id==='importfile'){importJSON(e.target.files?.[0])}});
document.addEventListener('submit',e=>{if(e.target.id==='editform'){saveEdit(e);return}if(e.target.id==='shopform'){e.preventDefault();const n=e.target.elements.item.value.trim();if(n){data.shopping.push({id:Date.now().toString()+Math.random(),name:n,done:false});persist();draw()}}if(e.target.id==='stockform'){e.preventDefault();const f=e.target.elements;data.stock.unshift({id:Date.now().toString()+Math.random(),name:f.name.value.trim(),qty:f.qty.value.trim(),date:f.date.value});persist();draw()}});
if('serviceWorker'in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
draw();
</script></body></html>
